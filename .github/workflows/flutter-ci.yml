name: NeuroSim Flutter CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Analyze, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Display Flutter and Dart versions
      - name: Check Flutter environment
        run: |
          flutter --version
          dart --version

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Verify Dart formatting
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # 6. Static code analysis
      - name: Flutter analyze
        run: flutter analyze

      # 7. Run tests and generate coverage
      - name: Run Flutter tests
        run: flutter test --coverage --reporter expanded

      # 8. Build Android debug APK
      - name: Build Android APK
        run: flutter build apk --debug

      # 9. Upload test coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurosim-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

      # 10. Upload debug APK
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neurosim-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
